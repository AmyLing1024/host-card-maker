<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手卡制作器</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260524-role-colors" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel" aria-label="手卡设置">
        <div class="brand-block">
          <p class="eyebrow">Host Card Maker</p>
          <h1>手卡制作器</h1>
        </div>

        <section class="panel-section entry-actions">
          <label class="drop-zone" for="word-file" id="drop-zone">
            <input id="word-file" type="file" accept=".docx,.doc" />
            <span class="drop-icon" aria-hidden="true">+</span>
            <strong>导入 Word 主持稿</strong>
            <small>支持 .docx；.doc 请先另存为 .docx</small>
          </label>
          <button class="ghost-button" id="sample-button" type="button">载入示例</button>
        </section>

        <section class="panel-section settings-grid" aria-label="排版控制">
          <label>
            <span>字号</span>
            <input id="font-size" type="range" min="10" max="34" value="24" />
            <output id="font-size-value">24 pt</output>
          </label>

          <label>
            <span>行距</span>
            <input id="line-height" type="range" min="1.2" max="2" value="1.55" step="0.05" />
            <output id="line-height-value">1.55</output>
          </label>

          <label>
            <span>边距</span>
            <input id="margin-mm" type="range" min="6" max="16" value="10" />
            <output id="margin-mm-value">10 mm</output>
          </label>

          <label>
            <span>纸张</span>
            <select id="paper-size">
              <option value="A4" selected>A4</option>
              <option value="A5">A5</option>
              <option value="A3">A3</option>
              <option value="LETTER">Letter</option>
            </select>
            <output id="paper-size-value">A4</output>
          </label>

          <label>
            <span>方向</span>
            <select id="paper-orientation">
              <option value="portrait" selected>竖排</option>
              <option value="landscape">横排</option>
            </select>
            <output id="paper-orientation-value">竖排</output>
          </label>

          <div class="settings-stepper-row">
            <span>行数</span>
            <div class="stepper" role="group" aria-label="设置行数">
              <button type="button" class="stepper-button" data-step-target="layout-rows" data-step-delta="-1">−</button>
              <input id="layout-rows" type="text" inputmode="numeric" pattern="[0-9]*" value="4" aria-label="行数" />
              <button type="button" class="stepper-button" data-step-target="layout-rows" data-step-delta="1">+</button>
            </div>
            <output id="layout-rows-value">4 行</output>
          </div>

          <div class="settings-stepper-row">
            <span>列数</span>
            <div class="stepper" role="group" aria-label="设置列数">
              <button type="button" class="stepper-button" data-step-target="layout-columns" data-step-delta="-1">−</button>
              <input id="layout-columns" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="列数" />
              <button type="button" class="stepper-button" data-step-target="layout-columns" data-step-delta="1">+</button>
            </div>
            <output id="layout-columns-value">1 列</output>
          </div>
        </section>

        <section class="panel-section">
          <div class="background-actions" aria-label="背面背景设置">
            <label class="file-button" for="background-file">
              <input id="background-file" type="file" accept="image/*" />
              <span>导入背面图片</span>
            </label>
            <label class="color-button" for="background-color">
              <input id="background-color" type="color" value="#ff0000" />
              <span class="color-button-swatch" id="background-color-swatch" aria-hidden="true"></span>
              <span>纯色背景</span>
            </label>
          </div>
          <div class="background-preview" id="background-preview" hidden>
            <div class="background-preview-swatch" id="background-preview-swatch" aria-hidden="true">
              <img id="background-preview-image" alt="背面图片预览" />
            </div>
            <div>
              <strong id="background-preview-title">已设置背面图片</strong>
              <small id="background-file-name"></small>
            </div>
            <button class="text-button" id="remove-background-button" type="button">移除</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="stat-row">
            <span>手卡</span>
            <strong id="card-count">0 张</strong>
          </div>
          <div class="stat-row">
            <span>打印</span>
            <strong id="print-layout-summary">A4 4 行 × 1 列</strong>
          </div>
          <button class="primary-button" id="print-button" type="button" disabled>打印 / 导出 PDF</button>
          <p class="status-message" id="status-message">等待导入 .docx 文件。</p>
        </section>
      </aside>

      <section class="workspace" aria-label="手卡预览">
        <div class="preview-toolbar">
          <div>
            <p class="eyebrow" id="preview-layout-summary">A4 4 行 × 1 列预览</p>
            <h2 id="document-title">未导入文档</h2>
          </div>
        </div>
        <div class="preview-scroll" id="preview-scroll">
          <div class="empty-state" id="empty-state">
            <strong>把主持稿拖进来，自动生成手卡。</strong>
            <span>默认大字、宽行距，方便现场快速扫读。</span>
          </div>
          <div class="cards-preview" id="cards-preview"></div>
        </div>
      </section>
    </main>

    <div class="print-preview-modal" id="print-preview-modal" hidden>
      <div class="print-preview-backdrop" data-close-print-preview></div>
      <section class="print-preview-panel" role="dialog" aria-modal="true" aria-labelledby="print-preview-title">
        <header class="print-preview-header">
          <div>
            <p class="eyebrow">Print Preview</p>
            <h2 id="print-preview-title">打印前预览</h2>
          </div>
          <button class="icon-button" id="close-preview-button" type="button" aria-label="关闭预览">×</button>
        </header>
        <div class="print-preview-meta">
          <span id="preview-sheet-count">0 页 A4</span>
          <span id="preview-print-mode">A4 四乘一，每页 4 张手卡</span>
        </div>
        <div class="print-preview-scroll" id="print-preview-scroll">
          <div class="print-preview-pages" id="print-preview-pages"></div>
        </div>
        <footer class="print-preview-actions">
          <button class="ghost-button" id="cancel-preview-button" type="button">返回修改</button>
          <button class="primary-button" id="confirm-print-button" type="button">确认打印 / 导出 PDF</button>
        </footer>
      </section>
    </div>

    <section class="print-root" id="print-root" aria-hidden="true"></section>
    <div class="measurement-card" id="measurement-card" aria-hidden="true"></div>

    <script src="./vendor/mammoth.browser.min.js"></script>
    <script src="./src/app.js?v=20260524-role-colors"></script>
  </body>
</html>
